name: BLACK ORACLE REPORT CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Test (fails if tests silently go missing)
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap "dist/**/*.test.js" | tee test-output.tap
          passed=$(grep -E '^# pass [0-9]+' test-output.tap | awk '{print $3}')
          echo "passed tests: $passed"
          if [ "${passed:-0}" -lt 194 ]; then echo "expected at least 194 passing tests"; exit 1; fi
      - name: Verify independent Railway runtime config
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('railway.json','utf8')); if(c.build?.buildCommand!=='npm ci --ignore-scripts && npm run build') throw new Error('unexpected Railway build command'); if(c.deploy?.startCommand!=='npm start') throw new Error('unexpected Railway start command'); if(c.deploy?.healthcheckPath!=='/health') throw new Error('Railway healthcheck must be /health');"
